services:
  multistreamer-gun-relay:
    build: .
    container_name: multistreamer-gun-relay
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - gun-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gun-data:
