<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Multistreamer mark</title>
  <desc id="desc">Four stream tiles converging on a shared live viewport.</desc>
  <defs>
    <linearGradient id="shell" x1="72" y1="54" x2="442" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101F3D"/>
      <stop offset="1" stop-color="#07101F"/>
    </linearGradient>
    <linearGradient id="cyan" x1="96" y1="92" x2="244" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34E7FF"/>
      <stop offset="1" stop-color="#0788FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="416" y1="92" x2="268" y2="244" gradientUnits="userSpaceOnUse">
